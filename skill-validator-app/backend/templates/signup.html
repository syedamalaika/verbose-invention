{% extends 'base.html' %}

{% block title %}Create Account - SkillProof{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 px-6">
    <div class="glass p-8 rounded-2xl shadow-2xl">
        <h2 class="text-3xl font-bold mb-2">Join SkillProof</h2>
        <p class="text-slate-400 mb-8">Start your journey to becoming a certified expert.</p>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-slate-400 mb-2">Username</label>
                <input type="text" name="username" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">Password</label>
                <input type="password" name="password" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">I am a...</label>
                <select name="role" class="w-full bg-[#1e293b] border border-white/10 rounded-xl px-4 py-3 focus:border-indigo-500 focus:outline-none transition">
                    <option value="student">Student / Candidate</option>
                    <option value="employer">Employer / Recruiter</option>
                </select>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-xl font-bold transition">Create Account</button>
        </form>
        
        <p class="mt-8 text-center text-slate-500">
            Already have an account? <a href="{% url 'login' %}" class="text-indigo-400 hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
